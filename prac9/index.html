<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Access | Student Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero-panel" aria-label="Campus Access introduction">
      <div class="brand-mark" aria-hidden="true">CA</div>
      <h1>Campus Access</h1>
    </section>

    <section class="content-panel">
      <div class="view theme-view" id="themeView">
        <p class="step-label">Step 1 of 2</p>
        <h2>Choose your theme</h2>

        <div class="theme-options" role="radiogroup" aria-label="Theme preference">
          <button class="theme-card" type="button" data-theme="light" role="radio" aria-checked="false">
            <span class="theme-preview light-preview" aria-hidden="true"><span></span></span>
            <span><strong>Light</strong><small>Bright and focused</small></span>
            <span class="radio-dot" aria-hidden="true"></span>
          </button>
          <button class="theme-card" type="button" data-theme="dark" role="radio" aria-checked="false">
            <span class="theme-preview dark-preview" aria-hidden="true"><span></span></span>
            <span><strong>Dark</strong><small>Easy on the eyes</small></span>
            <span class="radio-dot" aria-hidden="true"></span>
          </button>
        </div>

        <div class="action-row">
          <button class="primary-button" id="continueButton" type="button" disabled>Continue to login <span aria-hidden="true">&#8594;</span></button>
          <button class="text-button" id="clearPreference" type="button">Clear preference</button>
        </div>
        <p class="status-message" id="themeStatus" aria-live="polite"></p>
      </div>

      <div class="view login-view" id="loginView" hidden>
        <p class="step-label">Step 2 of 2</p>
        <h2>Student login</h2>

        <form id="studentForm" novalidate>
          <div class="form-grid">
            <label>First name<input name="firstName" type="text" autocomplete="given-name" required></label>
            <label>Last name<input name="lastName" type="text" autocomplete="family-name" required></label>
            <label>PRN<input name="prn" type="text" inputmode="numeric" autocomplete="off" required></label>
            <label>Email<input name="email" type="email" autocomplete="email" required></label>
            <label>Phone number<input name="phone" type="tel" autocomplete="tel" required></label>
            <label>Gender<select name="gender" required><option value="">Select gender</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Prefer not to say</option></select></label>
          </div>
          <button class="primary-button submit-button" type="submit">Continue to portal <span aria-hidden="true">&#8594;</span></button>
          <p class="status-message" id="formStatus" aria-live="polite"></p>
        </form>
        <button class="back-button" id="backButton" type="button">&#8592; Change theme</button>
      </div>
    </section>

    <footer class="student-info" aria-label="Student details">
      <span>Name: Mohit Lilhare</span>
      <span>PRN: 24070521044</span>
      <span>Batch: A2</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
