<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f6d365, #fda085);
    }

    .todo-container {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 16px;
      padding: 30px 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: #ff7f50;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.2s ease;
    }

    .add-btn {
      background: #ff7f50;
      color: #fff;
      font-weight: bold;
    }

    .add-btn:hover {
      background: #ff6a3d;
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #f9f9f9;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
      border: 1px solid #eee;
    }

    .task-text {
      flex: 1;
      color: #333;
      word-break: break-word;
    }

    li.done .task-text {
      text-decoration: line-through;
      color: #888;
    }

    .task-actions {
      display: flex;
      gap: 8px;
    }

    .edit-btn {
      background: #4caf50;
      color: white;
    }

    .delete-btn {
      background: #e74c3c;
      color: white;
    }

    .edit-btn:hover {
      background: #3d9a40;
    }

    .delete-btn:hover {
      background: #d63b2f;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 10px 0;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="todo-container">
    <h1>Todo List</h1>

    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a new task..." />
      <button class="add-btn" onclick="addTask()">Add</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script>
    let taskInput = document.getElementById('taskInput');
    let taskList = document.getElementById('taskList');

    function addTask() {
      let taskText = taskInput.value.trim();

      if (!taskText) {
        alert('Please enter a task.');
        taskInput.focus();
        return;
      }

      let li = document.createElement('li');
      li.innerHTML = `
        <span class="task-text">${taskText}</span>
        <div class="task-actions">
          <button class="edit-btn" onclick="editTask(this)">Edit</button>
          <button class="delete-btn" onclick="deleteTask(this)">Delete</button>
        </div>
      `;

      taskList.appendChild(li);
      taskInput.value = '';
      taskInput.focus();
    }

    function editTask(button) {
      let li = button.closest('li');
      let taskText = li.querySelector('.task-text');
      let currentText = taskText.textContent.trim();
      let newText = prompt('Edit task:', currentText);

      if (newText !== null) {
        let updatedText = newText.trim();
        if (updatedText) {
          taskText.textContent = updatedText;
        } else {
          alert('Task cannot be empty.');
        }
      }
    }

    function deleteTask(button) {
      let li = button.closest('li');
      li.remove();

      if (taskList.children.length === 0) {
        let emptyMessage = document.createElement('li');
        emptyMessage.className = 'empty';
        emptyMessage.textContent = 'No tasks yet';
        taskList.appendChild(emptyMessage);
      }
    }

    taskInput.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        addTask();
      }
    });
  </script>
</body>
</html>
