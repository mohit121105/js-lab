<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Billing Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="bill-box">
        <h1>Shopping Bill</h1>

        <form id="billingForm">
          <div class="form-group">
            <label for="customerName">Customer Name</label>
            <input type="text" id="customerName" placeholder="Enter full name" required />
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter phone number" required />
          </div>

          <div class="form-group">
            <label for="address">Address</label>
            <textarea id="address" rows="3" placeholder="Enter address" required></textarea>
          </div>

          <div class="row">
            <div class="form-group small">
              <label for="price">Price per Item</label>
              <input type="number" id="price" min="1" step="0.01" placeholder="0.00" required />
            </div>

            <div class="form-group small">
              <label for="quantity">Quantity</label>
              <input type="number" id="quantity" min="1" step="1" placeholder="1" required />
            </div>
          </div>

          <button type="submit" class="calculate-btn">Calculate Bill</button>
        </form>

        <div class="result-box" id="resultBox">
          <h2>Bill Summary</h2>
          <p><span>Customer:</span> <strong id="resultName">-</strong></p>
          <p><span>Phone:</span> <strong id="resultPhone">-</strong></p>
          <p><span>Address:</span> <strong id="resultAddress">-</strong></p>
          <p><span>Total Price:</span> <strong id="totalPrice">₹0.00</strong></p>
          <p><span>GST (18%):</span> <strong id="gst">₹0.00</strong></p>
          <p><span>Grand Total:</span> <strong id="grandTotal">₹0.00</strong></p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
